- # ====== Region: 7.1 Desupported Public View Columns =========
  id: 71039919371110941
  identification: 
    name: 7.1 Desupported Public View Columns
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select p.page_id
            ,p.page_name
            ,p.component_name
            ,p.component_type
            ,p.process_point
            ,p.plsql_code_clob
      from av_plsql_v p
      where application_id = :P0_APP_ID
      and (instr(lower(p.plsql_code_clob)
              ,'COMPONENT_SIGNATURE') > 0)
