- # ====== Region: 5.1 Deprecated APIs =========================
  id: 337492568655592917
  identification: 
    name: 5.1 Deprecated APIs
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select p.page_id
            ,p.page_name
            ,p.component_name
            ,p.component_type
            ,p.process_point
            ,p.plsql_code_clob
      from av_plsql_v p
      where application_id = :P0_APP_ID
      and (instr(lower(p.plsql_code_clob)
              ,'apex_lang.message') > 0 or
           instr(lower(p.plsql_code_clob)
              ,'apex_plugin_util.execute_plsql_code') > 0 or
           instr(lower(p.plsql_code_clob)
              ,'apex_util.custom_calendar') > 0 or
           instr(lower(p.plsql_code_clob)
              ,'apex_util.increment_calendar') > 0
          )
    page-items-to-submit: 
    - P0_APP_ID

  order-by: 
    type: None

  layout: 
    sequence: 10
    parent-region: '5 Deprecated Features - <a href="https://docs.oracle.com/en/database/oracle/apex/24.2/htmrn/deprecated-features.html" target="_blank">Link to Release Notes</a>' # 240964173975165904
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Collapsible
    template-options: 
    - '#DEFAULT#'
    - is-expanded
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: av-deprecated-51
    region-display-selector: false
    exclude-title-from-translation: false

  header-and-footer: 
    header-text: |
      <h4>APEX_LANG</h4>
      <b>APEX_LANG.MESSAGE</b> is deprecated. Instead, use APEX_LANG.GET_MESSAGE to support named substitution parameters.<br>
      <h4>APEX_PLUGIN_UTIL</h4>
      <b>APEX_PLUGIN_UTIL.EXECUTE_PLSQL_CODE</b> is now deprecated. Instead, use APEX_EXEC.EXECUTE_PLSQL Signature 1 or Signature 2.<br>
      <h4>APEX_UTIL</h4>
      <b>APEX_UTIL.CUSTOM_CALENDAR</b> and <b>APEX_UTIL.INCREMENT_CALENDAR</b> are deprecated.

  server-cache: 
    caching: Disabled

  customization: 
    customizable: Not Customizable By End Users

