- # ====== Dynamic Action: click refresh - refresh regions =====
  id: 79849283020931406
  identification: 
    name: click refresh - refresh regions

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: Refresh # 65476682361019079

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 79849764704931407
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: av_refresh_hide_show_regions()

    execution: 
      sequence: 10
      event: click refresh - refresh regions # 79849283020931406
      fire-when-event-result-is: True
      fire-on-initialization: false

